name: Expo diagnostics

# Manual check of which SDKs Expo Go supports and what the published
# update looks like, since Expo's servers can't be reached from every dev
# environment.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/expo-diagnostics.yml, scripts/check-update.js, scripts/check-accounts.js]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Accounts work end to end
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/check-accounts.js

      - name: Web site loads
        continue-on-error: true
        run: |
          S=https://humayon-is-on.github.io/deutsch-book
          curl -s -o index.html -w "index %{http_code}\n" "$S/"
          curl -s -o /dev/null -w "deep link %{http_code}\n" "$S/learn"
          for f in $(grep -o '/deutsch-book/[^"]*\.js' index.html); do
            curl -s -o /dev/null -w "%{http_code} %{size_download} bytes $f\n" "https://humayon-is-on.github.io$f"
          done

      - name: Asset request variants
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          A="https://assets.eascdn.net/_RN1QSv88JxvaI2wsXpUqawTa1Uz8nYovnhsqfyZOck?project=2765750f-6484-455a-ac71-f3b226684057"
          echo "--- plain"; curl -s -o page.html -w "%{http_code}\n" "$A"
          sed -e 's/<[^>]*>/ /g' page.html | tr -s ' \n' ' ' | head -c 1500; echo
          echo "--- expo headers"; curl -s -o /dev/null -w "%{http_code}\n" "$A" -H "expo-platform: android" -H "expo-runtime-version: exposdk:57.0.0" -H "expo-protocol-version: 1" -H "expo-channel-name: main"
          echo "--- with token"; curl -s -o /dev/null -w "%{http_code}\n" "$A" -H "Authorization: Bearer $EXPO_TOKEN"
          echo "--- with token + expo headers"; curl -s -o /dev/null -w "%{http_code}\n" "$A" -H "Authorization: Bearer $EXPO_TOKEN" -H "expo-platform: android" -H "expo-runtime-version: exposdk:57.0.0"

      - name: Check update downloads (android)
        continue-on-error: true
        run: node scripts/check-update.js 2765750f-6484-455a-ac71-f3b226684057 android

      - name: Expo Go versions
        run: |
          curl -s https://api.expo.dev/v2/versions/latest > versions.json
          node -e '
            const v = require("./versions.json").data;
            console.log("Expo Go android:", v.androidVersion, "ios:", v.iosVersion);
            for (const [sdk, info] of Object.entries(v.sdkVersions)) {
              if (parseInt(sdk) >= 54) console.log(sdk, JSON.stringify({ deprecated: info.isDeprecated, beta: info.beta, android: info.androidClientVersion, ios: info.iosClientVersion }));
            }
          '
      - name: Published update manifest
        run: |
          P=2765750f-6484-455a-ac71-f3b226684057
          for URL in "https://u.expo.dev/$P/group/bf2c7412-3c04-4d53-b85f-5c60acb71dbe" "https://u.expo.dev/$P?channel-name=main&runtime-version=exposdk:57.0.0" "https://u.expo.dev/$P"; do
            echo "=== $URL"
            curl -s -D - "$URL" -H "expo-platform: android" -H "expo-runtime-version: exposdk:57.0.0" -H "expo-channel-name: main" -H "expo-protocol-version: 1" \
              -H "accept: multipart/mixed,application/expo+json,application/json" -o body.txt | head -15
            node -e '
              const t = require("fs").readFileSync("body.txt", "utf8");
              const m = t.match(/\{"id".*\}/);
              if (!m) { console.log(t.slice(0, 500)); process.exit(0); }
              const j = JSON.parse(m[0]);
              delete j.assets;
              console.log(JSON.stringify(j, null, 1).slice(0, 6000));
            ' 
          done
