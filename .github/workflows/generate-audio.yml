# Records the German pronunciation files with Piper (voice: Thorsten) for any
# word or sentence that doesn't have one yet, commits them to content/audio,
# and republishes the web app so phones can download them.
name: Generate audio

on:
  push:
    branches: [main]
    paths: ['content/levels/**', 'scripts/audio-list.ts', 'src/services/speech/audio-key.ts']
  workflow_dispatch:
    inputs:
      levels:
        description: Levels to record (space separated)
        default: A1 A2 B1

permissions:
  contents: write
  actions: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: List what needs recording
        run: npx tsx scripts/audio-list.ts ${{ github.event.inputs.levels || 'A1 A2 B1' }} > todo.jsonl
      - name: Stop when nothing is new
        id: todo
        run: echo "count=$(wc -l < todo.jsonl)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.todo.outputs.count != '0'
        with:
          python-version: '3.12'
      - name: Cache the voice
        if: steps.todo.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: voice
          key: piper-thorsten-high-v1
      - name: Install Piper and the Thorsten voice
        if: steps.todo.outputs.count != '0'
        timeout-minutes: 20
        run: |
          # Each step is time-limited and retried: these downloads sometimes hang.
          try() { for n in 1 2 3; do timeout "$1" "${@:2}" && return 0; echo "retry $n: ${*:2}"; done; return 1; }
          echo "::group::ffmpeg"; which ffmpeg || { try 300 sudo apt-get update -qq && try 300 sudo apt-get install -y -qq ffmpeg; }; echo "::endgroup::"
          echo "::group::piper"; try 300 pip install -q piper-tts==1.3.0; echo "::endgroup::"
          mkdir -p voice
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/high
          for f in de_DE-thorsten-high.onnx de_DE-thorsten-high.onnx.json; do
            out=voice/${f/de_DE-thorsten-high/de}
            [ -s "$out" ] || try 300 curl -sSfL --connect-timeout 20 -o "$out" "$base/$f"
          done
          ls -la voice
      - name: Record
        if: steps.todo.outputs.count != '0'
        timeout-minutes: 90
        run: python scripts/generate-audio.py voice/de.onnx < todo.jsonl
      - name: Commit the recordings
        if: steps.todo.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add content/audio
          git commit -m "Record German audio (${{ steps.todo.outputs.count }} new)"
          git pull --rebase origin main
          git push origin HEAD:main
      # A push made by this workflow doesn't start the others, so publish here.
      - name: Republish the web app
        if: steps.todo.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-web.yml --ref main
